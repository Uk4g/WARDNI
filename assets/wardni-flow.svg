<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="How Wardni works: Watch, Listen, Triage, Act">
  <rect width="880" height="340" rx="16" fill="#12142a"/>
  <text x="440" y="42" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#dbe4ff">How Wardni works</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="20" y="80" width="190" height="130" rx="12" fill="#1c2148" stroke="#8aa2ff" stroke-width="1.5"/>
    <text x="115" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">1. Watch</text>
    <text x="115" y="145" text-anchor="middle" font-size="13" fill="#b9c4e8">Low-light / IR camera</text>
    <text x="115" y="165" text-anchor="middle" font-size="13" fill="#b9c4e8">SAM 3.1 → wireframe</text>
    <text x="115" y="185" text-anchor="middle" font-size="13" fill="#b9c4e8">No raw video shown</text>
    <rect x="235" y="80" width="190" height="130" rx="12" fill="#1c2148" stroke="#8aa2ff" stroke-width="1.5"/>
    <text x="330" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">2. Listen</text>
    <text x="330" y="145" text-anchor="middle" font-size="13" fill="#b9c4e8">Room intercom</text>
    <text x="330" y="165" text-anchor="middle" font-size="13" fill="#b9c4e8">Voice Transcribe → text</text>
    <text x="330" y="185" text-anchor="middle" font-size="13" fill="#b9c4e8">Pain / blanket / breakfast</text>
    <rect x="450" y="80" width="190" height="130" rx="12" fill="#1c2148" stroke="#8aa2ff" stroke-width="1.5"/>
    <text x="545" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">3. Triage</text>
    <text x="545" y="145" text-anchor="middle" font-size="13" fill="#b9c4e8">Muse Spark 1.3</text>
    <text x="545" y="165" text-anchor="middle" font-size="13" fill="#b9c4e8">Priority + reason</text>
    <text x="545" y="185" text-anchor="middle" font-size="13" fill="#b9c4e8">RED / YELLOW / routine</text>
    <rect x="665" y="80" width="190" height="130" rx="12" fill="#1c2148" stroke="#8aa2ff" stroke-width="1.5"/>
    <text x="760" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">4. Act</text>
    <text x="760" y="145" text-anchor="middle" font-size="13" fill="#b9c4e8">One dashboard</text>
    <text x="760" y="165" text-anchor="middle" font-size="13" fill="#b9c4e8">Nurse acknowledges</text>
    <text x="760" y="185" text-anchor="middle" font-size="13" fill="#b9c4e8">Morning handoff</text>
    <g fill="#8aa2ff" font-size="20" font-weight="700">
      <text x="212" y="150" text-anchor="middle">→</text>
      <text x="427" y="150" text-anchor="middle">→</text>
      <text x="642" y="150" text-anchor="middle">→</text>
    </g>
    <rect x="235" y="240" width="410" height="60" rx="12" fill="#1c2148" stroke="#5f7cff" stroke-width="1.5"/>
    <text x="440" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">The nurse decides. Wardni watches, listens, and orders.</text>
    <text x="440" y="288" text-anchor="middle" font-size="13" fill="#b9c4e8">Every action is logged → next night starts from the log</text>
  </g>
</svg>
